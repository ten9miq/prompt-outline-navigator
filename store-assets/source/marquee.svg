<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 560" role="img" aria-labelledby="title desc">
  <title id="title">Prompt Outline Navigator marquee</title>
  <desc id="desc">Prompt Outline Navigator branding with a conversation outline and navigation rail.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.58" stop-color="#14323a"/>
      <stop offset="1" stop-color="#302052"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#000" flood-opacity=".4"/>
    </filter>
  </defs>
  <rect width="1400" height="560" fill="url(#background)"/>
  <circle cx="130" cy="80" r="250" fill="#10a37f" opacity=".09"/>
  <circle cx="1280" cy="560" r="360" fill="#6940c5" opacity=".18"/>
  <g filter="url(#shadow)" transform="translate(115 90)">
    <rect width="420" height="380" rx="34" fill="#1f2937" stroke="#344052" stroke-width="3"/>
    <rect x="34" y="34" width="266" height="312" rx="24" fill="#111827"/>
    <path d="M78 96h174M78 158h134M78 220h158M78 282h102" fill="none" stroke="#10a37f" stroke-linecap="round" stroke-width="20"/>
    <path d="M354 50v280" fill="none" stroke="#6940c5" stroke-linecap="round" stroke-width="20"/>
    <rect x="322" y="174" width="64" height="58" rx="14" fill="#60a5fa"/>
  </g>
  <g font-family="Arial, sans-serif" fill="#f3f4f6">
    <text x="625" y="220" font-size="68" font-weight="700">Prompt Outline</text>
    <text x="625" y="298" font-size="68" font-weight="700">Navigator</text>
    <text x="630" y="365" font-size="28" fill="#a7f3d0">Navigate long conversations with clarity.</text>
  </g>

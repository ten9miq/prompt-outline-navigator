<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prompt Outline Navigator browser fixture</title>
  <link rel="stylesheet" href="../styles.css">
  <style>
    body { margin: 0; font-family: sans-serif; }
    #app { min-height: 100vh; background: #fafafa; }
    main { max-width: 760px; margin: auto; padding: 24px; }
    [data-message-author-role] { margin: 16px 0; padding: 12px; border: 1px solid #ddd; }
    #results { padding: 12px; color: #fff; background: #333; white-space: pre-wrap; }
    #results.pass { background: #166534; }
    #results.fail { background: #991b1b; }
  </style>
</head>
<body>
  <div id="app">
    <main>
      <h1>Browser integration fixture</h1>
      <pre id="results">RUNNING</pre>
      <div id="thread">
        <article data-testid="conversation-turn-1" data-turn-key="fixture-user-turn">
          <div data-message-author-role="user">Prompt &lt;script&gt; literal 🚀</div>
        </article>
        <article data-testid="conversation-turn-2" data-turn-key="fixture-assistant-turn">
          <div data-message-author-role="assistant">
            <h2 id="mutable-heading">&lt;script&gt;alert(1)&lt;/script&gt;</h2>
            <p>ordinary answer tokens</p>
          </div>
        </article>
      </div>
      <!-- Anonymized user-side DOM shape observed in the current ChatGPT UI. -->
      <div hidden data-chatgpt-conversation-selection-target="true" data-thread-find-target="conversation">
        <div class="thread-scroll-container" data-app-action-timeline-scroll>
          <div data-thread-user-message-navigation-content="true">
            <div data-turn-key="fixture-turn-key">
              <div data-content-search-turn-key="fixture-content-turn-key">
                <div class="flex flex-col gap-1.5">
                  <div class="group/user-message flex flex-col items-end gap-2"
                    data-chatgpt-search-unit-key="fixture-user-unit"
                    data-chatgpt-search-message-ids="fixture-message-ids">
                    <div class="w-full" data-content-search-unit-key="fixture-user-content">
                      <div class="group/user-message flex w-full flex-col gap-1 items-end">
                        <div class="bg-user-message text-user-message min-w-0 max-w-(--user-chat-width) overflow-hidden break-words"
                          data-user-message-bubble="true">
                          <span>Anonymous fixture prompt</span>
                        </div>
                        <div class="turn-action-controls"></div>
                      </div>
                    </div>
                  </div>
                  <div class="assistant-message" data-chatgpt-search-unit-key="fixture-assistant-unit">
                    <h4 class="sr-only" data-conversation-role="assistant">Assistant</h4>
                    <div data-chatgpt-selection-message-id="fixture-assistant-message"
                      data-chatgpt-selection-conversation-id="fixture-conversation">
                      <div data-markdown-text-style="assistant-message"><h2>Anonymous fixture heading</h2></div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
          <div data-thread-scroll-footer="true">
            <form data-chatgpt-composer data-composer-placement="thread">
              <div contenteditable="true" data-composer-markdown class="ProseMirror"></div>
            </form>
          </div>
        </div>
      </div>
    </main>
  </div>
  <script src="../src/shared.js"></script>
  <script src="../src/source-adapters.js"></script>
  <script src="../src/sidebar.js"></script>
  <script src="../src/conversation.js"></script>
  <script src="../src/navigation.js"></script>
  <script src="../src/active-tracker.js"></script>
  <script src="../content.js"></script>
  <script>
    const waitFrame = () => new Promise((resolve) => requestAnimationFrame(() => requestAnimationFrame(resolve)));
    const waitForStructureSync = () => new Promise((resolve) => setTimeout(resolve, 180));
    const results = [];
    function check(condition, label) {
      results.push(`${condition ? 'PASS' : 'FAIL'}: ${label}`);
      if (!condition) throw new Error(label);
    }

    window.addEventListener('load', async () => {
      const output = document.getElementById('results');
      try {
        await waitFrame();
        const sidebar = document.getElementById('chatgpt-toc-sidebar');
        const observedPrompt = document.querySelector('[data-chatgpt-search-unit-key][data-chatgpt-search-message-ids]:has([data-user-message-bubble="true"])');
        check(Boolean(observedPrompt), 'observed user wrapper exists in the anonymized modern DOM fixture');
        check(observedPrompt.matches(TOCNavigator.SELECTORS.userMessage), 'modern user wrapper matches the shared prompt selector');
        check(document.querySelector('[data-chatgpt-search-unit-key]:has([data-conversation-role="assistant"])')?.querySelector('h2')?.textContent === 'Anonymous fixture heading',
          'observed assistant wrapper exposes headings without including its role label');
        check(Boolean(document.querySelector(TOCNavigator.SELECTORS.thread)), 'observed conversation root selector matches the anonymized fixture');
        check(document.querySelector(TOCNavigator.SELECTORS.conversationScroll)?.classList.contains('thread-scroll-container'),
          'reverse scrolling root selector matches the anonymized fixture');
        check(Boolean(document.querySelector(TOCNavigator.SELECTORS.threadComposer)), 'thread composer selector avoids the home composer');
        check(sidebar.classList.contains('is-open'), 'sidebar opens by default');
        check(document.body.classList.contains('chatgpt-toc-open'), 'body reserves sidecar space');
        check(document.getElementById('app').classList.contains('chatgpt-toc-app-root'), 'app root is marked without reparenting');
        check(sidebar.querySelector('.toc-text').textContent === '<script>alert(1)<\/script>', 'HTML-like heading stays literal');
        check(!sidebar.querySelector('script'), 'untrusted text does not create elements');

        document.getElementById('mutable-heading').textContent = '<div>updated & safe</div>';
        await waitFrame();
        check(sidebar.querySelector('.toc-text').textContent === '<div>updated & safe</div>', 'heading text updates incrementally');

        const assistant = document.querySelector('[data-message-author-role="assistant"]');
        const added = document.createElement('h3');
        added.textContent = '日本語 English 🚀';
        assistant.append(added);
        await waitFrame();
        check(sidebar.querySelectorAll('.toc-item').length === 2, 'new heading is added');

        document.getElementById('mutable-heading').remove();
        await waitFrame();
        check(sidebar.querySelectorAll('.toc-item').length === 1, 'removed heading is reconciled');

        const thread = document.getElementById('thread');
        const userTurn = document.createElement('article');
        userTurn.innerHTML = '<div data-message-author-role="user">Second prompt</div>';
        const assistantTurn = document.createElement('article');
        assistantTurn.innerHTML = '<div data-message-author-role="assistant"><h1>A &amp; B</h1></div>';
        thread.append(userTurn, assistantTurn);
        await waitForStructureSync();
        check(sidebar.querySelectorAll('.toc-group').length === 2, 'new assistant turn adds one group');
        check(sidebar.querySelectorAll('.toc-group-title')[1].textContent === 'Prompt 2', 'groups stay in DOM order');

        const firstUserTurn = thread.querySelector('[data-testid="conversation-turn-1"]');
        const firstAssistantTurn = thread.querySelector('[data-testid="conversation-turn-2"]');
        firstUserTurn.remove();
        firstAssistantTurn.remove();
        await waitForStructureSync();
        check(sidebar.querySelectorAll('.toc-group').length === 2, 'virtualized stable turn remains in the TOC');
        thread.prepend(firstUserTurn, firstAssistantTurn);
        await waitForStructureSync();
        check(sidebar.querySelectorAll('.toc-group').length === 2, 'remounted stable turn reconnects without duplication');

        sidebar.querySelector('.toc-close').click();
        check(!sidebar.classList.contains('is-open') && !document.body.classList.contains('chatgpt-toc-open'), 'close releases sidecar space');
        document.getElementById('chatgpt-toc-toggle').click();
        check(sidebar.classList.contains('is-open') && document.body.classList.contains('chatgpt-toc-open'), 'toggle reopens sidebar');

        output.className = 'pass';
        output.textContent = `ALL ${results.length} BROWSER TESTS PASSED\n${results.join('\n')}`;
        document.title = 'PASS - Prompt Outline Navigator browser fixture';
      } catch (error) {
        output.className = 'fail';
        output.textContent = `${results.join('\n')}\nFAIL: ${error.message}`;
        document.title = 'FAIL - Prompt Outline Navigator browser fixture';
      }
    }, { once: true });
  </script>
</body>
</html>
